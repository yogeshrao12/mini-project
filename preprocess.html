<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preprocessing</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background: linear-gradient(
                rgba(0, 0, 0, 0.75),
                rgba(0, 0, 0, 0.75)
            ),
            url("static/img/7.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #eaeaea;
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 40px 20px 25px;
        }

        header h1 {
            font-size: 30px;
            color: #00e5ff;
            margin-bottom: 8px;
        }

        header a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
        }

        header a:hover {
            color: #00e5ff;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        section {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        h2 {
            color: #4caf50;
            margin-bottom: 10px;
        }

        h3 {
            color: #ffd54f;
            margin-bottom: 6px; /* 🔹 reduced */
        }

        pre {
            background: rgba(0, 0, 0, 0.6);
            padding: 14px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 14px;
            color: #eaeaea;
            margin-top: 6px; /* 🔹 reduced */
        }

        /* 🔹 LOGS FIX */
        .logs {
            margin-top: 6px;
        }

        .logs p {
            margin: 4px 0; /* 🔹 tighter log spacing */
            font-family: monospace;
            white-space: pre-wrap;
            font-size: 14px;
        }

        /* 🔹 PREVIEW ALIGNMENT FIX */
        .preview {
            margin: 6px 0 10px; /* 🔹 removes huge gap */
        }

        .preview table {
            width: 100%;
            border-collapse: collapse;
            margin: 6px 0; /* 🔹 reduced */
            font-size: 14px;
        }

        .preview th,
        .preview td {
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 6px 8px; /* 🔹 tighter cells */
            word-break: break-word;
            color: #eaeaea;
            vertical-align: top;
        }

        .preview th {
            background-color: rgba(255, 255, 255, 0.15);
            color: #00e5ff;
        }

        .action {
            text-align: center;
            margin-top: 18px;
        }

        .action a {
            display: inline-block;
            padding: 10px 20px;
            background: #00e5ff;
            color: #000;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
        }

        .action a:hover {
            background: #00bcd4;
        }
    </style>
</head>

<body>

<header>
    <h1>Preprocessing</h1>
    <a href="/trainer_dashboard">← Back to Dashboard</a>
</header>

<div class="container">

    <section>
        <h2>✅ Preprocessing Completed</h2>
    </section>

    <section>
        <h3>📊 Final Summary</h3>
        <pre>{{ summary }}</pre>
    </section>

    <section>
        <h3>🧠 Detailed Preprocessing Steps</h3>
        <div class="logs">
            {{ details | safe }}
        </div>
    </section>

    <div class="action">
        <a href="/preprocess_again">🔁 Preprocess Again</a>
    </div>

</div>

</body>
</html>
