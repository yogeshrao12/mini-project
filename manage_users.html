<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Manage Users</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      background: linear-gradient(
        rgba(0, 0, 0, 0.75),
        rgba(0, 0, 0, 0.75)
      ),
      url("static/img/7.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #eaeaea;
    }

    header {
      text-align: center;
      padding: 40px 20px;
    }

    header h2 {
      font-size: 28px;
      color: #00e5ff;
      margin-bottom: 15px;
    }

    header a {
      color: #ffffff;
      text-decoration: none;
      font-weight: 500;
    }

    header a:hover {
      color: #00e5ff;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 25px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 14px;
      text-align: center;
    }

    th {
      background: rgba(0, 229, 255, 0.15);
      color: #00e5ff;
      font-weight: 600;
    }

    tr {
      background: rgba(255, 255, 255, 0.05);
    }

    tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.08);
    }

    td a {
      color: #ff6b6b;
      text-decoration: none;
      font-weight: 500;
    }

    td a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

<header>
  <h2>Manage Users</h2>
  <a href="/controller_dashboard">← Back to Dashboard</a>
</header>

<div class="container">
  <div class="card">

    <table>
      <tr>
        <th>User ID</th>
        <th>Username</th>
        <th>Action</th>
      </tr>

      {% for u in users %}
      <tr>
        <td>{{ u[0] }}</td>
        <td>{{ u[1] }}</td>
        <td>
          <a href="/delete_user/{{ u[0] }}"
             onclick="return confirm('Are you sure you want to delete this user?')">
            Delete
          </a>
        </td>
      </tr>
      {% endfor %}
    </table>

  </div>
</div>

</body>
</html>
