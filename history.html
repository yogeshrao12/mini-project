<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Prediction History</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background: linear-gradient(
                rgba(0, 0, 0, 0.75),
                rgba(0, 0, 0, 0.75)
            ),
            url("static/img/7.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #eaeaea;
        }

        header {
            text-align: center;
            padding: 40px 20px;
        }

        header h2 {
            font-size: 28px;
            color: #00e5ff;
            margin-bottom: 10px;
        }

        header a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
        }

        header a:hover {
            color: #00e5ff;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        th, td {
            padding: 14px;
            text-align: left;
        }

        th {
            background: rgba(0, 0, 0, 0.6);
            color: #00e5ff;
            font-weight: 600;
        }

        tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.05);
        }

        td {
            color: #eaeaea;
            font-size: 14px;
        }

        a.delete-link {
            color: #ff5252;
            text-decoration: none;
            font-weight: 500;
        }

        a.delete-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            table, thead, tbody, th, td, tr {
                display: block;
            }

            th {
                display: none;
            }

            tr {
                margin-bottom: 15px;
            }

            td {
                padding: 10px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }
        }
    </style>
</head>

<body>

<header>
    <h2>Prediction History</h2>
    <a href="/user_dashboard">← Back to Dashboard</a>
</header>

<div class="container">

    <table>
        <tr>
            <th>Text</th>
            <th>Prediction</th>
            <th>Date</th>
            <th>Action</th>
        </tr>

        {% for r in records %}
        <tr>
            <td>{{ r[1] }}</td>
            <td>{{ r[2] }}</td>
            <td>{{ r[3] }}</td>
            <td>
                <a class="delete-link" href="/delete_history/{{ r[0] }}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>

</div>

</body>
</html>
