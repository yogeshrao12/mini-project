<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Controller Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background: linear-gradient(
                rgba(0, 0, 0, 0.75),
                rgba(0, 0, 0, 0.75)
            ),
            url("static/img/7.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #eaeaea;
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 50px 20px 30px;
        }

        header h2 {
            font-size: 30px;
            color: #00e5ff;
        }

        .container {
            max-width: 420px;
            margin: auto;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .card p {
            color: #ff6b6b;
            text-align: center;
            margin-bottom: 15px;
        }

        form input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: none;
            outline: none;
            font-size: 14px;
        }

        form button {
            width: 100%;
            padding: 12px;
            background: #00e5ff;
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        form button:hover {
            background: #00bcd4;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #bbb;
            text-decoration: none;
        }

        .back-link:hover {
            color: #00e5ff;
        }
    </style>
</head>

<body>

<header>
    <h2>Controller Login</h2>
</header>

<div class="container">
    <div class="card">

        {% with messages = get_flashed_messages() %}
            {% for msg in messages %}
                <p>{{ msg }}</p>
            {% endfor %}
        {% endwith %}

        <form method="post">
            <input name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <a href="/" class="back-link">← Back to Home</a>
    </div>
</div>

</body>
</html>
